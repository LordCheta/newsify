[workspace]
resolver = "2"
members = ["crates/newsify-core", "crates/newsify-worker"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LordCheta/newsify"
authors = ["Lord Cheta <cmaduabuchi@live.com>"]

[profile.release]
# The worker is shipped as WebAssembly: favour size.
opt-level = "s"
lto = true
codegen-units = 1
